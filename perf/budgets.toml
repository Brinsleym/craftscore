# Performance budgets (docs/scorecard.md#performance). Reference devices: a 2022 mid-range
# Android tablet, a base iPad, a 4-core laptop; desktop numbers from the fixed CI runner.
# `cargo xtask perf` will measure these into perf/baseline.json; until then they are unmeasured.

